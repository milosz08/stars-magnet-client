name: stars-magnet

services:
  stars-magnet-client:
    container_name: stars-magnet-client
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      STARS_MAGNET_API_URL: http://host.docker.internal:8000
    networks:
      - stars-magnet-network

networks:
  stars-magnet-network:
    driver: bridge
